<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Willkommen</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background:#000; }

  iframe#mainFrame {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    border: none;
  }

  #exitZone {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 60px;
    z-index: 5000;
    background: transparent;
  }

  #overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center; justify-content: center;
    z-index: 9999;
  }
  #overlay.show { display: flex; }

  #overlay iframe {
    width: 92vw; height: 90vh;
    border: none; background: #fff;
    border-radius: 8px;
  }

  #closeBtn {
    position: absolute; top: 15px; right: 15px;
    width: 46px; height: 46px;
    background: #ff2e2e; color: #fff;
    border: none; border-radius: 50%;
    font-size: 26px; font-weight: bold;
    cursor: pointer; z-index: 10000;
    line-height: 46px;
    box-shadow: 0 0 12px rgba(0,0,0,0.6);
  }
  #closeBtn:hover { background: #d40000; }
</style>
</head>
<body>

<iframe id="mainFrame" src="https://natur1984.sendshark.com/pb/ambassador"></iframe>
<div id="exitZone"></div>

<div id="overlay">
  <button id="closeBtn" title="Schließen">×</button>
  <iframe id="frame" src="about:blank"></iframe>
</div>

<script>
  const overlay  = document.getElementById('overlay');
  const frame    = document.getElementById('frame');
  const closeBtn = document.getElementById('closeBtn');
  const exitZone = document.getElementById('exitZone');

  const urls = [
    "https://secureyourdata.gotbackuptour.com/?tr=twiceconfirmedtraffic",
    "https://lockmyposition.com/ref/natur/2152"
  ];

  let currentIndex = 0;
  let isOpen = false;
  let cooldown = false;

  function showPopup() {
    if (isOpen || cooldown) return;
    if (currentIndex >= urls.length) currentIndex = 0;
    isOpen = true;
    frame.src = urls[currentIndex];
    overlay.classList.add('show');
  }

  function closePopup() {
    overlay.classList.remove('show');
    frame.src = "about:blank";
    isOpen = false;
    currentIndex++;
    cooldown = true;
    setTimeout(() => { cooldown = false; }, 800);
  }

  closeBtn.addEventListener('click', closePopup);

  // 1) Exit-Intent: Maus fährt in die obere 60-px-Zone
  exitZone.addEventListener('mouseenter', showPopup);

  // 2) Maus verlässt das Fenster nach oben
  document.addEventListener('mouseleave', (e) => {
    if (e.clientY <= 0) showPopup();
  });

  // 3) Fokus verloren – aber nur wenn das Dokument wirklich den Fokus verliert
  //    (nicht wenn der iframe den Fokus bekommt!)
  window.addEventListener('blur', () => {
    // kurz warten und prüfen, ob das Fenster wirklich inaktiv ist
    setTimeout(() => {
      if (!document.hasFocus()) {
        showPopup();
      }
    }, 300);
  });
</script>

</body>
</html>

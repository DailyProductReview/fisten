    background:#ffff00;
    color:#000;
    border:3px solid #000;
    cursor:pointer;
    text-transform:uppercase;

  input[type=submit]:hover{background:#fff}
  .guarantee{
    margin-top:1.8vmin;

</head>
<body>
  <div class="wrap">

<script>
(function(){
  var end = new Date(); end.setHours(24,0,0,0); // ends at midnight
  var el = document.getElementById('cd');
  function tick(){
    var d = Math.max(0, end - new Date()), s = Math.floor(d/1000);
    var h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
    el.textContent = h + 'h ' + (m<10?'0':'') + m + 'm ' + (sec<10?'0':'') + sec + 's';
  }
  tick(); setInterval(tick,1000);
})();
</script>

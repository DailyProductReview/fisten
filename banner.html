        /* banner grid */
        .banner-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem 1.5rem;
            justify-items: center;
            align-items: center;
            margin-bottom: 2rem;
        }

        .banner-grid.large-banners {

        .banner-grid.bottom-banners {

        }

            background: rgba(18, 20, 32, 0.85);
            border-radius: 1.8rem;
            padding: 0.75rem 0.75rem 0.5rem;
            box-shadow: 0 10px 25px -8px rgba(0, 0, 0, 0.7),
                        inset 0 1px 0 rgba(255, 255, 255, 0.04);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            border: 1px solid rgba(120, 100, 200, 0.12);
            min-height: 110px;
        }

        .banner-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 35px rgba(130, 60, 255, 0.25),
                        0 20px 35px -12px rgba(0, 0, 0, 0.9);
            border-color: rgba(160, 120, 255, 0.35);
            background: rgba(22, 24, 40, 0.95);
        }

        .banner-card a {
            display: block;
            line-height: 0;
            text-decoration: none;
            border-radius: 1rem;
            overflow: hidden;
            transition: opacity 0.2s, filter 0.2s;
        }

        .banner-card a:hover {
            opacity: 0.92;
            filter: brightness(1.1);
        }

        .banner-card img {
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 0.9rem;
        }

        /* responsive */
        @media (max-width: 580px) {
            .landing-container {
                padding: 1.5rem 1rem;
                border-radius: 1.8rem;
            }

            h1 {
                font-size: 1.7rem;
            }

            h1 span {
                font-size: 0.75rem;
                padding: 0.25rem 0.8rem;
            }

            .banner-grid {
                grid-template-columns: 1fr;
                gap: 1.2rem;
            }

            .banner-grid.large-banners,
            .banner-grid.bottom-banners {
                grid-template-columns: 1fr;
            }
        }

        @media (min-width: 581px) and (max-width: 820px) {

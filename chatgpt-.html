<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatGPT God Mode</title>
<style>
  :root {
    --bg: #14123a;
    --panel: #1d1a52;
    --text: #f3f0ff;
    --muted: #b9b3e6;
    --gold: #f5b942;
    --gold-dark: #d99a1f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(circle at 50% 0%, #2b2680 0%, var(--bg) 60%);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  main { width: 100%; max-width: 560px; text-align: center; }
  h1 {
    font-size: clamp(2.6rem, 9vw, 4.4rem);
    line-height: 1.05;
    margin: 0 0 16px;
    letter-spacing: -0.02em;
    color: var(--gold);
  }
  p.sub {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 1.1rem;
    line-height: 1.5;
    color: var(--muted);
    margin: 0 0 32px;
  }
  .optin {
    background: var(--panel);
    border: 1px solid #3a3590;
    border-radius: 14px;
    padding: 28px 24px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .optin table { width: 100%; border-collapse: collapse; }
  .optin td { padding: 6px 0; }
  .optin label { display: block; text-align: left; font-size: .95rem; margin-bottom: 6px; }
  .optin input[type="text"],
  .optin input[type="email"] {
    width: 100%;
    padding: 14px;
    font-size: 1rem;
    border: 2px solid transparent;
    border-radius: 8px;
    background: #fff;
    color: #111;
  }
  .optin input[type="text"]:focus,
  .optin input[type="email"]:focus { outline: none; border-color: var(--gold); }
  .optin input[type="submit"] {
    width: 100%;
    margin-top: 10px;
    padding: 15px;
    font-size: 1.05rem;
    font-weight: 700;
    border: 0;
    border-radius: 8px;
    background: var(--gold);
    color: #1a1500;
    cursor: pointer;
  }
  .optin input[type="submit"]:hover { background: var(--gold-dark); }
  .optin input[type="submit"]:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .optin img { position: absolute; width: 1px; height: 1px; opacity: 0; }
  small { display: block; margin-top: 18px; font-family: system-ui, sans-serif; color: var(--muted); font-size: .8rem; }
</style>
</head>
<body>
<main>
  <h1>ChatGPT God Mode</h1>
  <p class="sub">Enter your email below and get instant access.</p>

  <div class="optin">
    <form method="POST" action="https://gogvo.com/subscribe.php">
      <input type="hidden" name="AffiliateName" value="natur1984NLS">
      <input type="hidden" name="CampaignCode" value="fCbCGBjAERJv">
      <input type="hidden" name="TrackParam" value="new_form">
      <input type="hidden" name="FormId" value="25259280">
      <table align="center">
        <tr>
          <td>
            <label for="email">Please enter your email:</label>
            <input type="email" id="email" name="Email" placeholder="you@example.com" required>
          </td>
        </tr>
        <tr>
          <td align="center">
            <input type="submit" value="Submit">
          </td>
        </tr>
      </table>
      <img src="https://gogvo.com/show_form.php?id=25259280&TrackParam=new_form" alt="">
    </form>
  </div>

  <small>We respect your privacy. Unsubscribe at any time.</small>
</main>
</body>
</html>

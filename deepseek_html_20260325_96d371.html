<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Close High-Ticket Sales · The Power of No</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #f7f9fc 0%, #eef2f5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
      padding: 1.5rem;
    }

    /* card / container — clean, centered, minimalist */
    .landing {
      max-width: 640px;
      width: 100%;
      background: #ffffff;
      border-radius: 2.5rem;
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.2), 0 2px 5px rgba(0, 0, 0, 0.02);
      padding: 2.5rem 2rem 3rem 2rem;
      text-align: center;
      transition: all 0.2s ease;
    }

    /* headline — bold, confident, slightly dramatic */
    .headline {
      font-size: clamp(2.2rem, 8vw, 3.8rem);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 1.8rem;
      color: #0a0c10;
    }

    /* accent on "NO" — makes it pop */
    .headline strong {
      background: linear-gradient(135deg, #e11d48, #b91c1c);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      display: inline-block;
      font-weight: 800;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
      position: relative;
    }

    /* optional small sub-note — but "sonst nix" means almost nothing else.
       We keep only title, email field, button. But a tiny breathing space is fine.
       No extra text or description. */
    .form-wrapper {
      margin-top: 1rem;
      width: 100%;
    }

    /* direct form styling – no extra labels, no extra text */
    .steed-form {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 1.25rem;
      width: 100%;
    }

    /* email input — clean, large touch area */
    .steed-form input[type="text"] {
      width: 100%;
      padding: 1rem 1.25rem;
      font-size: 1.1rem;
      font-weight: 500;
      border: 1.5px solid #e2e8f0;
      border-radius: 60px;
      background: #ffffff;
      transition: all 0.2s;
      outline: none;
      font-family: inherit;
      color: #0f172a;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
    }

    .steed-form input[type="text"]:focus {
      border-color: #e11d48;
      box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.15);
    }

    .steed-form input[type="text"]::placeholder {
      color: #94a3b8;
      font-weight: 450;
    }

    /* button — bold, distinct, no secondary text */
    .steed-form button {
      background: #0f172a;
      color: white;
      border: none;
      padding: 1rem 1.25rem;
      font-size: 1.2rem;
      font-weight: 700;
      border-radius: 60px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.05s ease;
      font-family: inherit;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 20px -8px rgba(15, 23, 42, 0.3);
    }

    .steed-form button:hover {
      background: #1e293b;
    }

    .steed-form button:active {
      transform: scale(0.98);
    }

    /* hidden fields don't create any UI — perfect */
    input[type="hidden"] {
      display: none;
    }

    /* extra minimalism: no footer, no logo, no additional message */
    /* but we keep it accessible and responsive */

    /* for very small screens, adjust padding */
    @media (max-width: 520px) {
      .landing {
        padding: 2rem 1.5rem 2.5rem 1.5rem;
      }
      .steed-form input[type="text"], 
      .steed-form button {
        padding: 0.85rem 1.2rem;
      }
    }

    /* ensure no unexpected elements appear */
    .extra-note, .disclaimer, .small-print, .bonus {
      display: none;
    }

    /* but the user expects "sonst nix" – only title, email, button. exactly that. */
    /* no additional text, no privacy note, no "we respect your email" */
  </style>
</head>
<body>
  <div class="landing">
    <!-- Title: Close High-Ticket Sales By Saying "NO" 
         using <strong> for "NO" to emphasize the core message, but no extra elements -->
    <h1 class="headline">
      Close High-Ticket Sales By Saying <strong>“NO”</strong>
    </h1>

    <!-- ONLY email field + button. exactly as requested. -->
    <div class="form-wrapper">
      <form method="post" action="https://www.sendsteed.com/subscribe/" class="steed-form">
        <!-- email field: exact placeholder and required type="text" from original snippet -->
        <input type="text" name="e123432" required placeholder="your@email.com" autocomplete="email">
        
        <!-- hidden fields as provided -->
        <input type="hidden" name="lllid" value="123432">
        <input type="hidden" name="lluid" value="sandyarta">
        <input type="hidden" name="redirect" value="">
        <input type="hidden" name="source" value="no"> 
        
        <!-- button: "Submit" as in original spec, no extra text -->
        <button type="submit">Submit</button>
      </form>
    </div>
    <!-- absolutely nothing else: no paragraph, no image, no link, no counter -->
  </div>
</body>
</html>

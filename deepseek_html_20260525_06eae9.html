<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>$400+ Clickbank Week | Lead Gen Secret Case Study 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: radial-gradient(circle at 20% 30%, #0b1120, #03060c);
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.6rem;
      height: 100%;
      width: 100%;
    }

    .landing {
      max-width: 1000px;
      width: 100%;
      max-height: 98vh;
      background: rgba(10, 18, 30, 0.75);
      backdrop-filter: blur(2px);
      border-radius: 1.8rem;
      box-shadow: 0 20px 40px -15px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    .content {
      padding: 0.6rem 1.5rem 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero-title {
      font-size: clamp(1.2rem, 5vw, 1.9rem);
      font-weight: 800;
      line-height: 1.2;
      text-align: center;
      background: linear-gradient(135deg, #FFE6B0, #FFB347);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 0.5rem;
    }

    .video-container {
      width: 95%;
      max-width: 800px;
      margin: 0.2rem auto 0.5rem auto;
      border-radius: 1.2rem;
      overflow: hidden;
      box-shadow: 0 10px 25px -8px rgba(0,0,0,0.5);
      background: #000;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .button-wrapper {
      text-align: center;
      margin: 0.2rem 0 0;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: linear-gradient(95deg, #FF6A2C, #FF3B00);
      padding: 1.2rem 3rem;
      border-radius: 70px;
      font-size: 1.5rem;
      font-weight: 800;
      color: white;
      text-decoration: none;
      box-shadow: 0 12px 28px -6px rgba(255, 60, 0, 0.6);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      cursor: pointer;
      letter-spacing: 0.5px;
      width: 100%;
      max-width: 450px;
    }

    .cta-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 35px -6px rgba(255, 60, 0, 0.8);
    }

    .cta-button:active {
      transform: translateY(1px);
    }

    /* Bei kleineren Höhen alles etwas kompakter */
    @media (max-height: 700px) {
      .content {
        padding: 0.4rem 1.2rem 0.7rem 1.2rem;
      }
      .hero-title {
        font-size: 1.2rem;
        margin-bottom: 0.3rem;
      }
      .video-container {
        margin: 0.1rem auto 0.3rem auto;
      }
      .cta-button {
        padding: 0.9rem 2.2rem;
        font-size: 1.2rem;
        max-width: 380px;
      }
    }

    @media (max-height: 600px) {
      .hero-title {
        font-size: 1rem;
        margin-bottom: 0.2rem;
      }
      .cta-button {
        padding: 0.7rem 1.8rem;
        font-size: 1rem;
        gap: 10px;
        max-width: 320px;
      }
    }

    @media (max-height: 520px) {
      .cta-button {
        padding: 0.5rem 1.4rem;
        font-size: 0.9rem;
      }
      .hero-title {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
<div class="landing">
  <div class="content">
    <h1 class="hero-title">
      $400+ Clickbank Week?!...<br>My Lead Gen Secret Case Study Results 2026
    </h1>

    <div class="video-container">
      <div class="video-wrapper">
        <iframe 
          src="https://www.youtube.com/embed/5gL1B7cbx-o?si=DJM-fg-Tj50gyP4t" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <div class="button-wrapper">
      <a href="https://www.myleadgensecret.com/sizzle/?rid=44757&src=videotw" 
         class="cta-button" 
         target="_blank" 
         rel="noopener noreferrer">
        ⚡ GET THE SAME RESULTS → ⚡
      </a>
    </div>
  </div>
</div>
</body>
</html>

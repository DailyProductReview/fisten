<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>$400+ Clickbank Week? | My Lead Gen Secret Case Study 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* make body fill entire viewport, no overflow, exact fit */
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;          /* critical: no scrollbars at all */
    }

    body {
      background: linear-gradient(145deg, #f0f4fd 0%, #e6edf8 100%);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
    }

    /* main container takes full viewport, but with safe inner spacing */
    .full-viewport {
      width: 100%;
      height: 100vh;            /* exactly full viewport height */
      max-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1rem 1.5rem;     /* breathing space, ensures no overflow */
    }

    /* inner card: uses flex column to distribute space and prevent overflow */
    .landing-card {
      width: 100%;
      max-width: 1200px;
      height: auto;
      max-height: 98vh;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(0px);
      border-radius: 48px;
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.25), 0 8px 20px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      overflow: hidden;         /* ensures rounded corners and no inner scroll */
      transition: all 0.2s ease;
    }

    /* main content area with flex column, using gap and min height tricks */
    .content-flex {
      padding: 1.8rem 2rem 2rem 2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.8rem;
    }

    /* --- title section (dynamic but compact) --- */
    .title-section {
      text-align: center;
      margin-bottom: 0.25rem;
    }

    .main-title {
      font-size: 2.7rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: #071a2f;
      word-break: break-word;
    }

    .main-title .highlight {
      background: linear-gradient(125deg, #f15b2c, #ff9142);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      display: inline-block;
    }

    .case-study-badge {
      font-size: 1rem;
      font-weight: 500;
      color: #2c5f8a;
      background: #eef2fc;
      display: inline-block;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      margin-top: 0.4rem;
      letter-spacing: -0.2px;
    }

    /* video container: large, but adapts to remaining space without causing scroll */
    .video-container {
      width: 100%;
      margin: 0.5rem 0 0.8rem 0;
      border-radius: 28px;
      background: #000;
      box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      flex-shrink: 1;          /* allows shrinking if needed, but preserves ratio */
    }

    /* responsive 16:9 wrapper */
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;  /* 16:9 aspect ratio */
      height: 0;
      background: #000;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* button area: very clear, visible directly under video */
    .button-area {
      text-align: center;
      margin-top: 0.2rem;
      margin-bottom: 0.25rem;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(95deg, #e6491c, #ff7b2e);
      padding: 0.9rem 2rem;
      border-radius: 60px;
      font-size: 1.35rem;
      font-weight: 700;
      color: white;
      text-decoration: none;
      letter-spacing: -0.2px;
      box-shadow: 0 8px 18px -4px rgba(230, 73, 28, 0.4);
      transition: all 0.2s ease;
      gap: 0.5rem;
      border: none;
      cursor: pointer;
    }

    .cta-button:hover {
      transform: translateY(-3px);
      background: linear-gradient(95deg, #d13b0e, #ff6a1f);
      box-shadow: 0 15px 25px -8px rgba(230, 73, 28, 0.5);
    }

    .cta-button:active {
      transform: translateY(1px);
    }

    /* ultra-light stats / trust row - optional but keeps info compact */
    .trust-row {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-top: 0.5rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: #3a5e7a;
    }

    .trust-row span {
      background: #f0f4fa;
      padding: 0.2rem 0.9rem;
      border-radius: 30px;
      letter-spacing: -0.2px;
    }

    /* ensure no overflow on very small heights (e.g. 500px) */
    @media (max-height: 700px) {
      .content-flex {
        padding: 1rem 1.5rem 1.2rem 1.5rem;
        gap: 0.4rem;
      }
      .main-title {
        font-size: 2rem;
      }
      .cta-button {
        padding: 0.6rem 1.5rem;
        font-size: 1.1rem;
      }
      .trust-row {
        margin-top: 0.2rem;
      }
      .case-study-badge {
        font-size: 0.8rem;
        margin-top: 0.2rem;
      }
    }

    @media (max-height: 600px) {
      .main-title {
        font-size: 1.7rem;
      }
      .cta-button {
        padding: 0.5rem 1.2rem;
        font-size: 1rem;
      }
      .trust-row span {
        font-size: 0.65rem;
      }
    }

    @media (max-width: 720px) {
      .full-viewport {
        padding: 0.75rem;
      }
      .content-flex {
        padding: 1rem 1.2rem 1.2rem 1.2rem;
      }
      .main-title {
        font-size: 2rem;
      }
      .cta-button {
        font-size: 1.1rem;
        padding: 0.7rem 1.5rem;
      }
    }

    @media (max-width: 550px) {
      .main-title {
        font-size: 1.6rem;
      }
      .trust-row {
        gap: 0.8rem;
      }
      .case-study-badge {
        font-size: 0.7rem;
      }
    }

    /* to keep everything visible, ensure landscape on small heights works */
    @media (orientation: landscape) and (max-height: 550px) {
      .content-flex {
        gap: 0.2rem;
        padding: 0.7rem 1.5rem;
      }
      .video-container {
        margin: 0.2rem 0;
      }
      .cta-button {
        padding: 0.4rem 1rem;
        font-size: 0.9rem;
      }
      .main-title {
        font-size: 1.4rem;
      }
      .trust-row {
        margin-top: 0rem;
      }
    }

    /* Force no scroll anywhere: double safety */
    ::-webkit-scrollbar {
      display: none;
    }
    body {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body>
<div class="full-viewport">
  <div class="landing-card">
    <div class="content-flex">
      <!-- TITLE exactly as requested: "$400+ Clickbank Week?!...My Lead Gen Secret Case Study Results 2026" -->
      <div class="title-section">
        <h1 class="main-title">
          $400+ Clickbank Week?!...<br>
          <span class="highlight">My Lead Gen Secret</span> Case Study Results 2026
        </h1>
        <div class="case-study-badge">
          🔥 verified screenshots · real data 🔥
        </div>
      </div>

      <!-- VIDEO LARGE: embedded exactly the given iframe code, but in responsive wrapper -->
      <div class="video-container">
        <div class="video-wrapper">
          <iframe 
            src="https://www.youtube.com/embed/5gL1B7cbx-o?si=DJM-fg-Tj50gyP4t" 
            title="YouTube video player" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            referrerpolicy="strict-origin-when-cross-origin" 
            allowfullscreen>
          </iframe>
        </div>
      </div>

      <!-- BUTTON directly under video, link exactly as provided -->
      <div class="button-area">
        <a href="https://www.myleadgensecret.com/sizzle/?rid=44757&src=videotw" 
           class="cta-button" 
           target="_blank" 
           rel="noopener noreferrer">
          🧠 WATCH CASE STUDY + ACCESS
        </a>
      </div>

      <!-- tiny trust signals that stay within viewport, no extra scroll needed -->
      <div class="trust-row">
        <span>⚡ 100% free strategy</span>
        <span>📈 $400+ week results</span>
        <span>🎯 ClickBank proven</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>$400+ Clickbank Week 2026 | Lead Gen Secret Case Study</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* GLOBAL: NO SCROLLING EVER – forced viewport lock */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
    }

    body {
      background: radial-gradient(circle at 30% 10%, #0a0f1e, #020408);
      font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    /* MAIN CARD – uses full available height but never exceeds viewport */
    .landing {
      width: 100%;
      max-width: 1300px;
      height: auto;
      max-height: 100%;
      background: rgba(8, 14, 26, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 2rem;
      box-shadow: 0 25px 45px -15px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,200,100,0.15);
      overflow: hidden;      /* no inner scroll either */
      display: flex;
      flex-direction: column;
    }

    /* content uses flex column with auto gaps – all elements shrink naturally */
    .content {
      padding: 1rem 2rem 1.2rem 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
    }

    /* TITLE: exactly as required – strong & condensed */
    .hero-title {
      font-size: clamp(1.1rem, 5vw, 2rem);
      font-weight: 800;
      line-height: 1.25;
      text-align: center;
      letter-spacing: -0.01em;
      background: linear-gradient(125deg, #FFE7B2, #FFAA44, #FFD966);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 0.2rem;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    /* year badge / micro context */
    .year-badge {
      text-align: center;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: #FFB347;
      background: rgba(0, 0, 0, 0.5);
      display: inline-block;
      width: fit-content;
      margin: 0 auto 0.5rem auto;
      padding: 0.2rem 1rem;
      border-radius: 30px;
      backdrop-filter: blur(4px);
    }

    /* VIDEO CONTAINER – flexible but large. uses relative height based on viewport */
    .video-container {
      width: 100%;
      margin: 0.2rem 0 0.5rem 0;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 30px -12px rgba(0,0,0,0.6);
      background: #000;
      flex-shrink: 1;
    }

    /* 16:9 wrapper with dynamic sizing – video remains crisp */
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 */
      height: 0;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* BUTTON: prominent, below video, no scroll needed */
    .button-wrapper {
      text-align: center;
      margin: 0.2rem 0 0.2rem 0;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: linear-gradient(105deg, #FF5722, #E63E00);
      padding: 0.7rem 1.8rem;
      border-radius: 60px;
      font-size: 1.1rem;
      font-weight: 700;
      color: white;
      text-decoration: none;
      letter-spacing: -0.2px;
      box-shadow: 0 12px 18px -8px rgba(255, 50, 0, 0.5);
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
      white-space: nowrap;
    }

    /* responsive text on button for very small widths */
    @media (max-width: 550px) {
      .cta-button {
        padding: 0.6rem 1.2rem;
        font-size: 0.85rem;
        white-space: normal;
        word-break: keep-all;
      }
    }

    .cta-button:hover {
      transform: translateY(-2px);
      background: linear-gradient(105deg, #FF3A00, #CC3300);
      box-shadow: 0 16px 22px -10px rgba(255, 60, 0, 0.6);
    }
    .cta-button:active {
      transform: translateY(1px);
    }

    /* trust row – minimal but keeps one-screen design */
    .stats-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-top: 0.5rem;
      font-size: 0.7rem;
      font-weight: 500;
      color: #cbdaed;
      background: rgba(0, 0, 0, 0.35);
      padding: 0.4rem 1rem;
      border-radius: 40px;
      width: fit-content;
      align-self: center;
      backdrop-filter: blur(2px);
    }

    .stats-row span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* MEDIA: ensure for ANY desktop/laptop height (600px to 1080p) no scroll */
    /* For very small heights (laptop with 600px) we compress everything elegantly */
    @media (max-height: 700px) {
      .content {
        padding: 0.6rem 1.5rem 0.8rem 1.5rem;
      }
      .hero-title {
        font-size: clamp(1rem, 4vh, 1.5rem);
        margin-bottom: 0px;
      }
      .year-badge {
        font-size: 0.6rem;
        margin-bottom: 0.2rem;
        padding: 0.1rem 0.8rem;
      }
      .video-container {
        margin: 0.1rem 0 0.3rem 0;
        border-radius: 18px;
      }
      .button-wrapper {
        margin: 0.1rem 0;
      }
      .cta-button {
        padding: 0.4rem 1rem;
        font-size: 0.85rem;
      }
      .stats-row {
        margin-top: 0.3rem;
        padding: 0.2rem 0.7rem;
        gap: 0.6rem;
        font-size: 0.65rem;
      }
    }

    /* For very wide but short (landscape on mobile) – still no scroll */
    @media (max-aspect-ratio: 13/9) and (max-height: 550px) {
      .hero-title {
        font-size: 1rem;
      }
      .video-container {
        max-width: 70%;
        align-self: center;
        margin: 0.1rem auto;
      }
      .stats-row {
        font-size: 0.6rem;
      }
      .cta-button {
        font-size: 0.8rem;
      }
      .year-badge {
        font-size: 0.55rem;
      }
    }

    /* Fix for 4:3 or old monitors ensures no scroll */
    @media (max-height: 580px) and (min-width: 1024px) {
      .content {
        padding: 0.5rem 1.8rem;
      }
      .hero-title {
        font-size: 1.3rem;
        line-height: 1.2;
      }
      .video-container {
        margin: 0rem 0 0.2rem 0;
      }
    }

    /* make sure nothing overflows */
    .landing, .content {
      overflow: visible;
    }
    body, html {
      overflow: hidden;
    }

    /* small extra: iframe rounded corners */
    .video-container iframe {
      border-radius: 0;
    }
  </style>
</head>
<body>
<div class="landing">

<!-- ensure that body and html cannot scroll, and any accidental wheel does nothing -->
<script>
  (function() {
    // double insurance: prevent any scrolling via keyboard/mousewheel/touchmove
    function preventScroll(e) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
    
    // lock wheel and touchmove events on body to ensure 100% no scroll
    window.addEventListener('wheel', preventScroll, { passive: false });
    window.addEventListener('touchmove', preventScroll, { passive: false });
    window.addEventListener('keydown', function(e) {
      // prevent arrow keys and page up/down from scrolling
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'PageUp' || e.key === 'PageDown' || e.key === 'Home' || e.key === 'End') {
        e.preventDefault();
        e.stopPropagation();
      }
    });
    
    // also block scroll on body element itself
    document.body.addEventListener('wheel', preventScroll, { passive: false });
    document.body.addEventListener('touchmove', preventScroll, { passive: false });
    
    // small fix: if any child tries to scroll, block it entirely (just in case)
    const landing = document.querySelector('.landing');
    if(landing) {
      landing.addEventListener('wheel', preventScroll, { passive: false });
      landing.addEventListener('touchmove', preventScroll, { passive: false });
    }
  })();
</script>
</body>
</html>

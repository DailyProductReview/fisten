<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zufalls-Rotator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(145deg, #0b1120 0%, #1a2639 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
    }
    .rotator-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 2.5rem;
      padding: 2.5rem 2.2rem;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.02);
      transition: all 0.2s ease;
      text-align: center;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 500;
      letter-spacing: -0.5px;
      color: #eef5ff;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    .subhead {
      color: #9aaec9;
      font-size: 1rem;
      font-weight: 300;
      letter-spacing: 0.3px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding-bottom: 1.2rem;
      margin-bottom: 1.8rem;
    }
    .link-count {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 60px;
      padding: 0.6rem 1.6rem;
      display: inline-block;
      font-size: 0.9rem;
      font-weight: 400;
      color: #c8d9f0;
      border: 1px solid rgba(255,255,255,0.05);
      backdrop-filter: blur(4px);
      margin-bottom: 1.8rem;
    }
    .link-count span {
      font-weight: 600;
      color: #b7d0ff;
      margin: 0 4px;
    }
    .btn-rotate {
      background: #3b4f70;
      background-image: linear-gradient(145deg, #4c6490, #2e3f5a);
      border: none;
      border-radius: 60px;
      padding: 1rem 2.5rem;
      font-size: 1.25rem;
      font-weight: 500;
      color: white;
      cursor: pointer;
      box-shadow: 0 10px 20px -6px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
      transition: all 0.15s ease;
      letter-spacing: 0.3px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0.8rem 0 1.2rem;
    }
    .btn-rotate:hover {
      transform: scale(1.02);
      background-image: linear-gradient(145deg, #5b78a8, #344b6b);
      box-shadow: 0 14px 28px -8px #0a101e;
    }
    .btn-rotate:active {
      transform: scale(0.97);
    }
    .info-note {
      color: #7e94b5;
      font-size: 0.9rem;
      background: rgba(0,0,0,0.2);
      padding: 0.8rem 1.2rem;
      border-radius: 50px;
      border: 1px solid rgba(255,255,255,0.02);
      margin-top: 0.6rem;
      backdrop-filter: blur(2px);
    }
    .info-note i {
      font-style: normal;
      display: inline-block;
      margin-right: 6px;
    }
    .footer {
      margin-top: 2.2rem;
      color: #4f688b;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      border-top: 1px solid rgba(255,255,255,0.03);
      padding-top: 1.5rem;
      width: 100%;
      text-align: center;
    }
    .badge {
      background: #1e2b40;
      padding: 0.2rem 1rem;
      border-radius: 20px;
      color: #b0c7e7;
      font-size: 0.8rem;
      border: 1px solid #2f405b;
    }
    @media (max-width: 480px) {
      .rotator-card { padding: 1.8rem 1.2rem; }
      h1 { font-size: 1.8rem; }
      .btn-rotate { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="rotator-card">
    <h1>🌀 Link-Rotator</h1>
    <div class="subhead">zufällige Weiterleitung · jeden Besuch neu</div>
    
    <div class="link-count">
      <span id="linkCounter">0</span> aktive Links
    </div>

    <button class="btn-rotate" id="manualRotateBtn">
      <span>🎲</span> Zufälligen Link öffnen
    </button>

    <div class="info-note">
      <i>⚡</i> Beim Laden der Seite wird automatisch ein zufälliger Link geöffnet.
    </div>
    <div style="margin-top: 0.7rem;">
      <span class="badge">🔗 alle Links aus deiner Liste</span>
    </div>
  </div>
  <div class="footer">
    <span>rotator · zufällig · sofort</span>
  </div>

  <script>

        "https://hop.clickbank.net/?affiliate=verborgene&vendor=ambsador&cbpage=order",
        "https://a41f0lrgpiw2oamotehmwak70x.hop.clickbank.net/?&traffic_source=sendshark",
        "https://b4e77nmlegz9uhsct9rpjx7xeo.hop.clickbank.net/?cbpage=john&traffic_source=sendshark",
        "https://ef9e5sfmddv7jjqjx4p3wg1a4f.hop.clickbank.net/?&traffic_source=sendshark",
        "https://8271bsjpfn0clcjl3xn-pjjgj0.hop.clickbank.net/?&traffic_source=sendshark",

        "https://herculist.com/members/trafficbomb.cgi?naturallyinshape",
        "https://www.herculist.com/members/legends.cgi?naturallyinshape",
        "https://warriorplus.com/o2/a/x9jvz9/0/sendshark",

      ];

      // --------------------------------------------------------------
      // ZÄHLER ANZEIGEN
      // --------------------------------------------------------------
      const counterSpan = document.getElementById('linkCounter');
      if (counterSpan) {
        counterSpan.textContent = linkList.length;
      }

      // --------------------------------------------------------------
      // HILFSFUNKTION: zufälligen Link aus Array holen
      // --------------------------------------------------------------
      function getRandomLink() {
        if (!linkList || linkList.length === 0) {
          return null;
        }
        const randomIndex = Math.floor(Math.random() * linkList.length);
        return linkList[randomIndex];
      }

      // --------------------------------------------------------------
      // WEITERLEITUNG (öffnet im selben Tab / Fenster)
      // --------------------------------------------------------------
      function redirectToRandomLink() {
        const link = getRandomLink();
        if (link) {
          window.location.href = link;
        } else {
          // Fallback: falls keine Links vorhanden (sollte nicht passieren)
          alert('⚠️ Keine Links im Rotator. Bitte Liste prüfen.');
        }
      }

      // --------------------------------------------------------------
      // AUTOMATISCHER START: beim Seitenbesuch sofort weiterleiten
      // --------------------------------------------------------------
      // kleines Delay, damit die Seite sich kurz aufbaut (optional)
      // aber "sofort" im Sinne der Aufgabe: beim Laden wird weitergeleitet
      window.addEventListener('load', function() {
        // kurzer Timeout (0ms) um sicherzustellen, dass der Browser 
        // den Seiteninhalt nicht blockiert – aber es passiert quasi sofort.
        setTimeout(function() {
          redirectToRandomLink();
        }, 0);
      });

      // --------------------------------------------------------------
      // MANUELLER BUTTON (für Tests / falls jemand klickt)
      // --------------------------------------------------------------
      const manualBtn = document.getElementById('manualRotateBtn');
      if (manualBtn) {
        manualBtn.addEventListener('click', function(e) {
          e.preventDefault();
          redirectToRandomLink();
        });
      }

      // --------------------------------------------------------------
      // (OPTIONAL) falls der Benutzer die Seite mit Zurück-Taste 
      // wieder erreicht, kann erneut ein zufälliger Link geöffnet werden.
      // Aber das ist bereits durch das load-Event abgedeckt.
      // --------------------------------------------------------------
      console.log('✅ Link-Rotator initialisiert – ' + linkList.length + ' Links geladen.');
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    font-family: 'Georgia', 'Times New Roman', serif;
    background: #0a0018;
  }

  /* Mythischer animierter Hintergrund */
  body::before {
    content: "";
    position: fixed;
    inset: -50%;
    background:
      radial-gradient(circle at 20% 30%, rgba(120, 0, 255, 0.55), transparent 45%),
      radial-gradient(circle at 80% 20%, rgba(0, 200, 255, 0.45), transparent 45%),
      radial-gradient(circle at 70% 80%, rgba(255, 0, 180, 0.45), transparent 45%),
      radial-gradient(circle at 30% 85%, rgba(0, 255, 170, 0.35), transparent 45%),
      #0a0018;
    animation: swirl 24s linear infinite;
    filter: blur(40px);
    z-index: -3;
  }

  /* Sternen-Ebene */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(2px 2px at 10% 20%, #fff, transparent),
      radial-gradient(1px 1px at 30% 70%, #fff, transparent),
      radial-gradient(2px 2px at 60% 30%, #ffe9ff, transparent),
      radial-gradient(1px 1px at 80% 60%, #fff, transparent),
      radial-gradient(2px 2px at 45% 85%, #c6f0ff, transparent),
      radial-gradient(1px 1px at 90% 15%, #fff, transparent),
      radial-gradient(1px 1px at 15% 50%, #ffd7ff, transparent),
      radial-gradient(2px 2px at 70% 90%, #fff, transparent),
      radial-gradient(1px 1px at 55% 10%, #fff, transparent),
      radial-gradient(1px 1px at 25% 40%, #fff, transparent);
    opacity: 0.8;
    animation: twinkle 6s ease-in-out infinite alternate;
    z-index: -2;
    pointer-events: none;
  }

  @keyframes swirl {
    0%   { transform: rotate(0deg)   scale(1.05); }
    50%  { transform: rotate(180deg) scale(1.15); }
    100% { transform: rotate(360deg) scale(1.05); }
  }
  @keyframes twinkle {
    0%   { opacity: 0.4; }
    100% { opacity: 1; }
  }
  @keyframes shimmer {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }

  .stage {
    position: relative;
    height: 100vh;
    height: 100dvh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5vh;
    padding: 1.5vh 20px;
    text-align: center;
    z-index: 1;
  }

  h1 {
    font-size: clamp(1.4rem, 4.2vh, 3rem);
    font-weight: 900;
    line-height: 1.05;
    color: #fff;
    background: linear-gradient(90deg, #ffd76e, #ff6ec7, #6ec7ff, #7dffc4, #ffd76e);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 40px rgba(255, 110, 199, 0.35);
    animation: shimmer 8s linear infinite;
    flex: 0 0 auto;
  }

  .hero-img {
    width: auto;
    max-width: min(920px, 92vw);
    max-height: 60vh;
    height: auto;
    object-fit: contain;
    border-radius: 16px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.15),
      0 0 60px rgba(160, 90, 255, 0.6),
      0 0 120px rgba(0, 200, 255, 0.4);
    animation: floaty 6s ease-in-out infinite;
    flex: 0 1 auto;
    display: block;
    min-height: 0;
  }

  form {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
    max-width: 440px;
    padding: 14px 20px;
    border-radius: 18px;
    background: rgba(20, 5, 40, 0.45);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow:
      0 10px 40px rgba(0, 0, 0, 0.5),
      inset 0 0 30px rgba(160, 90, 255, 0.15);
    flex: 0 0 auto;
  }

  form table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
  }
  form table tr td { display: block; width: 100%; text-align: center; }

  form label {
    display: block;
    color: #f0e6ff;
    font-size: clamp(0.75rem, 1.5vh, 0.95rem);
    margin-bottom: 4px;
    letter-spacing: 0.04em;
    font-style: italic;
    text-shadow: 0 0 12px rgba(160, 90, 255, 0.6);
  }

  input[type="text"],
  input[type="email"] {
    width: 100%;
    padding: clamp(8px, 1.4vh, 12px) 16px;
    font-size: clamp(0.8rem, 1.6vh, 0.95rem);
    color: #fff;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(180, 130, 255, 0.45);
    border-radius: 10px;
    outline: none;
    transition: all 0.3s ease;
    font-family: inherit;
    box-shadow: inset 0 0 20px rgba(120, 60, 220, 0.15);
  }
  input[type="text"]:focus,
  input[type="email"]:focus {
    border-color: #ff6ec7;
    box-shadow:
      0 0 0 3px rgba(255, 110, 199, 0.25),
      0 0 30px rgba(255, 110, 199, 0.5),
      inset 0 0 20px rgba(255, 110, 199, 0.15);
    background: rgba(255, 255, 255, 0.1);
  }

  input[type="submit"] {
    margin-top: 3px;
    width: 100%;
    padding: clamp(9px, 1.5vh, 13px) 22px;
    font-size: clamp(0.8rem, 1.7vh, 1rem);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #1a002e;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #ffd76e, #ff6ec7, #6ec7ff, #7dffc4, #ffd76e);
    background-size: 300% 100%;
    animation: shimmer 6s linear infinite;
    transition: transform 0.2s ease, box-shadow 0.3s ease;
    font-family: inherit;
    box-shadow: 0 0 30px rgba(255, 110, 199, 0.6);
  }
  input[type="submit"]:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 0 50px rgba(255, 110, 199, 0.9);
  }
  input[type="submit"]:active {
    transform: translateY(0) scale(0.99);
  }

  form img { display: none; }

  /* Anpassung an kleine Höhen, damit nichts scrollt */
  @media (max-height: 720px) {
    .hero-img { max-height: 55vh; }
  }
  @media (max-height: 620px) {
    .hero-img { max-height: 48vh; }
    .stage { gap: 1vh; }
  }
  @media (max-height: 520px) {
    .hero-img { max-height: 42vh; }
  }
  @media (max-height: 440px) {
    .hero-img { max-height: 35vh; }
  }
</style>
</head>
<body>

  <main class="stage">
    <h1>Let others build your list</h1> 

    <img class="hero-img"
         src="https://images.nowlifestyle.com/images/affiliate/1664026/pb/assets/0964dc1404f391cfd2f7d0e7d2dd92f8.png"
         alt="Hero">

    <form method="POST" action="https://gogvo.com/subscribe.php">
      <input type="hidden" name="AffiliateName" value="natur1984NLS">
      <input type="hidden" name="CampaignCode" value="fCbCGBjAERJv">
      <input type="hidden" name="TrackParam" value="new_form">
      <input type="hidden" name="FormId" value="25235157">
      <table align="center">
        <tr>
          <td>
            <label for="email">Please enter your email:</label>
          </td>
        </tr>
        <tr>
          <td>
            <input id="email" type="text" name="Email" required>
          </td>
        </tr>
        <tr>
          <td align="center" colspan="2">
            <input type="submit" value="Submit">
          </td>
        </tr>
      </table>
      <img src="https://gogvo.com/show_form.php?id=25235157&TrackParam=new_form" alt="">
    </form>
  </main>

</body>
</html>

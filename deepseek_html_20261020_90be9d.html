<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't Forget To Confirm</title>
    <style>
        /* Grundlegendes Reset für saubere Darstellung */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        /* Der Haupttitel */
        h1 {
            font-size: 3.5rem; /* Groß und fett wie im Bild */
            font-weight: 800;
            color: #000000;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        /* Der Untertitel */
        h2 {
            font-size: 1.8rem;
            font-weight: 400;
            color: #000000;
            margin-bottom: 40px;
        }

        /* Das Eingabefeld */
        .email-input {
            width: 100%;
            padding: 18px 20px;
            font-size: 1.1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 20px;
            outline: none;
            color: #333;
        }

        .email-input::placeholder {
            color: #888;
        }

        .email-input:focus {
            border-color: #3b82f6;
        }

        /* Der Button */
        .submit-btn {
            width: 100%;
            padding: 20px;
            background-color: #2563eb; /* Das Blau aus dem Bild */
            color: white;
            font-size: 1.4rem;
            font-weight: 700;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #1d4ed8;
        }

        /* Der Fußnoten-Text */
        .disclaimer {
            margin-top: 25px;
            font-size: 1rem;
            color: #333;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Don't Forget To Confirm!</h1>
        <h2>Enter Your Email To Get Started</h2>

        <form action="#" method="POST">
            <input 
                type="email" 
                class="email-input" 
                placeholder="Enter Your Email Address" 
                required
            >
            
            <button type="submit" class="submit-btn">
                Activate My Commissions
            </button>
        </form>

        <p class="disclaimer">
            * Your bonuses will be sent to the email you entered above.
        </p>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zilara Tour</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      max-width: 480px;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 60px rgba(255, 255, 255, 0.08);
    }

    .video-wrap iframe,
    .video-wrap a {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .video-wrap iframe { border: 0; display: block; }

    .thumb {
      display: block;
      background-color: #000;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      text-decoration: none;
    }

    .play {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 62px;
      height: 62px;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.92);
      border-radius: 50%;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .play::before {
      content: "";
      margin-left: 4px;
      border-style: solid;
      border-width: 11px 0 11px 18px;
      border-color: transparent transparent transparent #000;
    }

    .thumb:hover .play {
      transform: translate(-50%, -50%) scale(1.08);
      background: #fff;
    }

    .cta {
      display: inline-block;
      margin-top: 28px;
      padding: 15px 40px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      color: #000;
      background: #fff;
      border-radius: 999px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .cta:hover, .cta:focus-visible {
      transform: translateY(-2px);
      background: #f0f0f0;
      box-shadow: 0 10px 30px rgba(255, 255, 255, 0.25);
      outline: none;
    }
    .cta:active { transform: translateY(0); }

    @media (max-width: 480px) {
      .cta { width: 100%; max-width: 320px; padding: 14px 24px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>

  <div class="video-wrap">
    <a class="thumb"
       href="https://www.youtube.com/watch?v=G0XK8wM8pVE"
       target="_blank" rel="noopener"
       style="background-image:url('https://img.youtube.com/vi/G0XK8wM8pVE/hqdefault.jpg');">
      <span class="play"></span>
    </a>
  </div>

  <a class="cta" href="https://warriorplus.com/o2/a/lxrqxx2/0/" target="_blank" rel="noopener">
    Discover Now
  </a>

</body>
</html>

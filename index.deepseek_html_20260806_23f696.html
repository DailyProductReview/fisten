<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Rotator · Dark Redirect</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      width:100%; height:100%;
      background:#0a0b0e;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    body { background:radial-gradient(circle at 30% 40%, #14161c, #08090c 90%); }
    .loader {
      text-align:center;
      padding:2rem;
      border-radius:2rem;
      backdrop-filter:blur(2px);
      background:rgba(12,14,18,0.5);
      border:1px solid rgba(255,255,255,0.03);
      box-shadow:0 20px 50px rgba(0,0,0,0.8);
      pointer-events:none;
      user-select:none;
    }
    .spinner {
      width:48px; height:48px;
      border:4px solid rgba(255,255,255,0.06);
      border-top:4px solid #8a8aff;
      border-radius:50%;
      animation:spin 0.9s cubic-bezier(0.6,0,0.4,1) infinite;
      margin:0 auto 1.2rem;
      box-shadow:0 0 20px rgba(100,100,255,0.15);
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    .loader p {
      font-weight:300;
      letter-spacing:0.04em;
      opacity:0.7;
      font-size:1.1rem;
      background:linear-gradient(135deg,#b0b0ff,#e0e0ff);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }
    .loader small {
      display:block;
      margin-top:0.7rem;
      font-size:0.7rem;
      opacity:0.2;
      letter-spacing:0.1em;
      color:#aaa;
    }
    /* Fallback‑Link (nur sichtbar, wenn JS blockiert wird) */
    .fallback-link {
      display: none;
      margin-top: 1.5rem;
      color: #8a8aff;
      text-decoration: underline;
      cursor: pointer;
      pointer-events: auto;
      font-size: 0.9rem;
    }
    .fallback-link:hover { color: #b0b0ff; }
    /* Falls kein JS, zeige den Link */
    .no-js .fallback-link { display: inline-block; }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>weiterleitung …</p>
    <small>⚡ zufällige zielseite</small>
    <!-- Fallback-Link für den Fall, dass automatische Weiterleitung nicht klappt -->
    <a href="#" class="fallback-link" id="fallbackLink">👉 hier klicken, falls nichts passiert</a>
  </div>

  <script>
    (function(){
      // ---------- DEINE WARRIORPLUS-LINKS ----------
      const urls = [
        "https://warriorplus.com/o2/a/s36n37m/0",
        "https://warriorplus.com/o2/a/gps60c9/0",
        "https://warriorplus.com/o2/a/shnbv11/0",
        "https://warriorplus.com/o2/a/rjvdpfw/0",
        "https://warriorplus.com/o2/a/rjvdpfw/0",
        "https://warriorplus.com/o2/a/bc6nqqs/0",
        "https://warriorplus.com/o2/a/bdk1g7x/0",
        "https://warriorplus.com/o2/a/x4mthn2/0",
        "https://warriorplus.com/o2/a/zbsq0gt/0"
      ];

      // Zufällige URL auswählen
      const targetUrl = urls[Math.floor(Math.random() * urls.length)];

      // Hintergrund sofort schwarz setzen
      document.documentElement.style.backgroundColor = '#08090c';
      document.body.style.backgroundColor = '#08090c';

      // --- WEITERLEITUNG MIT MEHREREN FALLBACKS ---

      // 1. Versuch: location.replace (überschreibt Verlauf)
      try {
        window.location.replace(targetUrl);
      } catch(e) {
        // falls replace fehlschlägt, weitermachen
      }

      // 2. Sicherheitshalber: falls nach 200ms noch keine Weiterleitung erfolgt ist,
      //    verwende location.href (als Backup)
      setTimeout(function() {
        // Prüfen, ob wir noch auf der gleichen Seite sind (d.h. replace hat nicht geklappt)
        // Dazu können wir die aktuelle URL mit der ursprünglichen vergleichen,
        // aber da wir die Original-URL nicht kennen, nutzen wir einfach einen zweiten Versuch.
        // Wir setzen einen weiteren Timer für den Fall, dass der erste nicht funktioniert.
        if (window.location.href.indexOf('index.html') !== -1 || window.location.href === window.location.href) {
          // Versuche mit href
          window.location.href = targetUrl;
        }
      }, 200);

      // 3. Falls alles fehlschlägt: Zeige den manuellen Link an und setze die Ziel-URL
      //    (dieser Link wird nur sichtbar, wenn JS aktiv ist, aber kein Redirect stattfindet)
      const fallbackLink = document.getElementById('fallbackLink');
      fallbackLink.style.display = 'inline-block';
      fallbackLink.href = targetUrl;
      fallbackLink.addEventListener('click', function(e) {
        e.preventDefault();
        window.location.href = targetUrl;
      });

      // 4. Wenn wir in einem iframe sind, versuche top.location
      try {
        if (window.top !== window.self) {
          window.top.location.replace(targetUrl);
        }
      } catch(e) {}

      console.log('🔀 Rotator: Ziel-URL =', targetUrl);
    })();
  </script>
  <!-- falls JS deaktiviert ist, zeigt CSS den Link -->
  <noscript>
    <style>
      .fallback-link { display: inline-block !important; }
    </style>
  </noscript>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Your Online Business</title>
    <style>
        /* Grundlegendes Styling - Schwarzer Hintergrund */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .page-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            max-width: 1400px;
            width: 95%;
            margin: 0 auto;
        }

        .side-image {
            flex: 0 0 auto;
            max-width: 320px;
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
        }

        .container {
            flex: 0 1 450px;
            padding: 35px 25px;
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid #1a7a2e;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(26, 122, 46, 0.3);
        }

        h1 {
            color: #2ecc40;
            font-size: 24px;
            line-height: 1.3;
            margin-bottom: 20px;
            font-weight: bold;
        }

        h2 {
            color: #2ecc40;
            font-size: 20px;
            line-height: 1.3;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .main-headline {
            color: #ffffff;
            font-size: 34px;
            font-weight: 900;
            margin-bottom: 30px;
            letter-spacing: -1px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        input[type="email"] {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #444;
            border-radius: 5px;
            box-sizing: border-box;
            outline: none;
            background-color: #1a1a1a;
            color: #ffffff;
        }

        input[type="email"]::placeholder {
            color: #888;
        }

        input[type="email"]:focus {
            border-color: #2ecc40;
            box-shadow: 0 0 8px rgba(46, 204, 64, 0.5);
        }

        input[type="submit"] {
            width: 100%;
            background-color: #1a7a2e;
            color: white;
            border: none;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin-top: 10px;
        }

        input[type="submit"]:hover {
            background-color: #2ecc40;
            transform: scale(1.02);
        }

        /* SEO-Text unter dem E-Mail-Feld */
        .seo-text {
            color: #cccccc;
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
            margin: 12px 0 5px;
            font-style: italic;
        }

        .seo-text strong {
            color: #2ecc40;
            font-style: normal;
        }

        .tracking-img {
            display: none;
        }

        #subliminal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            font-size: 120px;
            font-weight: 900;
            color: rgba(46, 204, 64, 0.2);
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.05s ease-in-out, transform 0.05s ease-in-out;
            text-transform: uppercase;
            letter-spacing: 10px;
        }

        #subliminal.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        @media (max-width: 1100px) {
            .side-image { max-width: 220px; }
            .container { flex: 0 1 400px; }
        }

        @media (max-width: 850px) {
            .page-wrapper {
                flex-direction: column;
                gap: 20px;
            }
            .side-image { max-width: 280px; }
            .container {
                width: 100%;
                max-width: 500px;
            }
        }

        @media (max-width: 600px) {
            h1 { font-size: 20px; }
            h2 { font-size: 17px; }
            .main-headline { font-size: 26px; }
            input[type="submit"] { font-size: 16px; padding: 15px; }
            #subliminal { font-size: 60px; }
            .side-image { max-width: 200px; }
            .seo-text { font-size: 12px; }
        }
    </style>
</head>
<body>

    <div id="subliminal">OPT IN</div>

    <div class="page-wrapper">

        <img src="https://imgallery.llsvr.com/sandyarta.69a8982e7d7a4.jpg" alt="Left Image" class="side-image">

        <div class="container">
            <h1>Let Us Help You Start & Grow A Profitable Online Business From Home!</h1>
            
            <h2>Join Our Business From Home Financial Revolution Today.</h2>
            
            <div class="main-headline">BE YOUR OWN BOSS</div>

            <form method="POST" action="https://gogvo.com/subscribe.php">
                <input type="hidden" name="AffiliateName" value="natur1984NLS">
                <input type="hidden" name="CampaignCode" value="fCbCGBjAERJv">
                <input type="hidden" name="TrackParam" value="new_form">
                <input type="hidden" name="FormId" value="25235157">
                
                <div class="form-group">
                    <input type="email" name="Email" placeholder="Enter Your Email..." required>
                </div>

                <!-- SEO-Text unter dem E-Mail-Feld -->
                <p class="seo-text">
                    Wondering <strong>how can I make fast money online</strong>? 
                    Get proven strategies, free tools &amp; step-by-step guidance delivered straight to your inbox.
                </p>
                
                <input type="submit" value="Claim Your Online Business Now">
                
                <img src="https://gogvo.com/show_form.php?id=25235157&TrackParam=new_form" class="tracking-img" alt="">
            </form>
        </div>

        <img src="https://images.nowlifestyle.com/images/affiliate/1664026/pb/assets/dd3569fc574d209205e80caac40d6662.png" alt="Right Image" class="side-image">

    </div>

    <script>
        window.addEventListener('load', function() {
            const subliminal = document.getElementById('subliminal');
            subliminal.classList.add('show');
            setTimeout(function() {
                subliminal.classList.remove('show');
            }, 150);
        });
    </script>

</body>
</html>

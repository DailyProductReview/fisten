<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Paid 200% Commissions!</title>
  <style>
    /* Simple, clean, and easy to read – "ugly" but functional */
    * {
      box-sizing: border-box;
      margin: 0;
    }
    body {
      background-color: #f0f0f0;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      margin: 0;
    }
    .landing-box {
      max-width: 700px;
      width: 100%;
      background: white;
      border: 4px solid #222;
      padding: 30px 25px;
      text-align: center;
      box-shadow: 10px 10px 0 #aaa;
      border-radius: 0;
    }
    /* typography – big, loud, simple */
    h1 {
      font-size: 2.5rem;
      font-weight: 900;
      text-transform: uppercase;
      color: #c00;
      background: yellow;
      display: inline-block;
      padding: 10px 20px;
      margin: 0 0 25px 0;
      border: 3px solid black;
      letter-spacing: 1px;
      line-height: 1.2;
      transform: rotate(-1deg);
    }
    .subhead {
      font-size: 1.8rem;
      font-weight: bold;
      color: #000;
      background: #ffcc00;
      padding: 8px 12px;
      display: inline-block;
      margin: 20px 0 15px 0;
      border: 2px dashed #333;
      text-transform: uppercase;
      word-break: break-word;
    }
    .image-container {
      margin: 30px 0 10px;
      background: #ddd;
      padding: 12px;
      border: 3px solid #444;
    }
    .image-container img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      border: 2px solid #888;
    }
    .bonus-headline {
      font-size: 1.4rem;
      font-weight: 800;
      color: #003366;
      background: #e0f0ff;
      padding: 15px 10px;
      margin: 25px 0 15px;
      border: 3px solid #0055aa;
      line-height: 1.3;
      text-transform: uppercase;
    }
    /* form styling – keep the structure simple */
    form {
      margin: 20px 0 0;
      width: 100%;
    }
    form table {
      margin: 0 auto;
      border-collapse: separate;
      border-spacing: 10px 15px;
      width: 100%;
    }
    form table td {
      padding: 0;
      font-size: 1.1rem;
      font-weight: bold;
    }
    label {
      font-size: 1.2rem;
      font-weight: bold;
      color: #222;
      display: block;
      text-align: left;
      white-space: nowrap;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 12px;
      font-size: 1.2rem;
      border: 3px solid #222;
      background: #fff;
      border-radius: 0;
      min-width: 220px;
      box-sizing: border-box;
    }
    input[type="submit"] {
      background: #ff4500;
      color: white;
      font-size: 1.8rem;
      font-weight: 900;
      padding: 15px 30px;
      border: 4px solid black;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-radius: 0;
      width: 100%;
      max-width: 350px;
      box-shadow: 5px 5px 0 #333;
      transition: all 0.05s linear;
      margin-top: 5px;
    }
    input[type="submit"]:hover {
      background: #cc3700;
      transform: translate(2px, 2px);
      box-shadow: 3px 3px 0 #333;
    }
    /* hidden track pixel – will show broken image? we keep it as is but hide if broken */
    .track-pixel {
      display: none;
    }
    /* make form responsive */
    @media (max-width: 550px) {
      h1 { font-size: 1.8rem; }
      .subhead { font-size: 1.3rem; }
      .bonus-headline { font-size: 1.1rem; }
      label { white-space: normal; font-size: 1rem; }
      input[type="submit"] { font-size: 1.3rem; padding: 12px 10px; }
    }
    /* ugly but readable */
    .attribution-note {
      font-size: 0.7rem;
      color: #666;
      margin-top: 15px;
      border-top: 1px solid #ccc;
      padding-top: 10px;
    }
  </style>
</head>
<body>
  <div class="landing-box">
    <!-- Main title -->
    <h1>Get Paid 200% Commissions!</h1>

    <!-- Sub headline with money style -->
    <div class="subhead">HERE IS HOW OTHERS BUILD A $MONEY$ MAKING LIST FOR YOU...</div>

    <!-- Image -->
    <div class="image-container">
      <img src="https://images.nowlifestyle.com/images/admin/pb/assets/9beaad75f15243ad34f9b383c237a12e.png" alt="Money making list illustration">
    </div>

    <!-- Bonus headline -->
    <div class="bonus-headline">GRAB YOUR $500.00 EMAIL MARKETING MASTERY SUPER BONUS FREE TODAY!!</div>

    <!-- Email form -->
    <form method="POST" action="https://gogvo.com/subscribe.php">
      <input type="hidden" name="AffiliateName" value="natur1984NLS">
      <input type="hidden" name="CampaignCode" value="fCbCGBjAERJv">
      <input type="hidden" name="TrackParam" value="new_form">
      <input type="hidden" name="FormId" value="25235157">

      <table align="center">
        <tr>
          <td>
            <label for="email">Please enter your email:</label>
          </td>
          <td>
            <input type="text" name="Email" id="email" placeholder="your@email.com" required>
          </td>
        </tr>
        <tr>
          <td align="center" colspan="2">
            <input type="submit" value="Submit">
          </td>
        </tr>
      </table>

      <!-- tracking pixel – hidden but kept as original -->
      <img src="https://gogvo.com/show_form.php?id=25235157&TrackParam=new_form" class="track-pixel" alt="" width="1" height="1">
    </form>

    <!-- small note - keeps it "simple to read ugly" but complete -->
    <div class="attribution-note">© 2025 — Simple ugly page. All text is intentionally loud.</div>
  </div>
</body>
</html>

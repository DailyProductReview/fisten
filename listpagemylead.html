<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Let Others Build Your Buyers List · 200% Commissions</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden; /* kein Scrollen */
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #eef3ff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.2rem 1.5rem;
      line-height: 1.3;
    }

    .landing-container {
      width: 100%;
      max-width: 1200px;
      max-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    /* Titel */
    h1 {
      font-size: clamp(1.1rem, 2.6vw, 2rem);
      font-weight: 800;
      text-align: center;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: #0b0f1a;
      text-shadow: 0 3px 15px rgba(0, 180, 255, 0.2);
      max-width: 1000px;
    }

    /* Untertitel */
    .subheadline {
      font-size: clamp(0.95rem, 2.1vw, 1.5rem);
      font-weight: 700;
      text-align: center;
      background: linear-gradient(135deg, #ffd966, #ffb347);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 2px 12px rgba(255, 200, 0, 0.45);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Media-Reihe: Bild links, Video rechts */
    .media-row {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      justify-content: center;
      gap: 1rem;
      width: 100%;
      flex-wrap: nowrap;
    }

    .media-item {
      flex: 1 1 0;
      min-width: 0;
      max-width: 50%;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.9), 0 0 0 2px rgba(0, 180, 216, 0.35);
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Bild – gleiche Größe wie Video */
    .media-item img {
      width: 100%;
      height: 100%;
      max-height: 42vh;
      object-fit: contain;
      display: block;
      background: #ffffff;
    }

    /* Video – gleiche Größe wie Bild */
    .media-item video {
      width: 100%;
      height: 100%;
      max-height: 42vh;
      object-fit: contain;
      display: block;
      background: #000;
      outline: none;
    }

    /* Button zentriert darunter */
    .cta-button {
      display: inline-block;
      background: linear-gradient(135deg, #00c9a7, #00b4d8);
      color: #0b0f1a;
      font-weight: 900;
      font-size: clamp(0.95rem, 2vw, 1.4rem);
      text-transform: uppercase;
      text-decoration: none;
      text-align: center;
      padding: 0.9rem 2.2rem;
      border-radius: 100px;
      letter-spacing: 0.05em;
      box-shadow: 0 0 25px #00b4d8, 0 10px 20px -5px black, 0 0 0 2px rgba(255, 255, 255, 0.25);
      transition: all 0.2s ease-in-out;
      margin-top: 0.4rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .cta-button:hover {
      background: linear-gradient(135deg, #00e0b0, #00c8ff);
      box-shadow: 0 0 40px #00e0ff, 0 14px 25px -5px black;
      transform: scale(1.02);
      color: #000;
    }

    .cta-button:active {
      transform: scale(0.98);
    }

    /* Mobile: stapeln, aber weiterhin ohne Scrollen */
    @media (max-width: 720px) {
      body {
        padding: 0.8rem;
      }

      .landing-container {
        gap: 0.7rem;
      }

      .media-row {
        flex-direction: column;
        gap: 0.7rem;
      }

      .media-item {
        max-width: 100%;
      }

      .media-item img,
      .media-item video {
        max-height: 24vh;
      }

      .cta-button {
        padding: 0.8rem 1.6rem;
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <div class="landing-container">

    <!-- Titel: "Let others build your buyers list" -->
    <h1>Let Others Build Your Buyers List — And Get Paid 200% Commissions!</h1>

    <!-- Untertitel -->
    <div class="subheadline">Grab Your $500.00 Super Bonus Free Today!!</div>

    <!-- Bild links, Video rechts – gleich groß -->
    <div class="media-row">
      <div class="media-item">
        <img 
          src="https://images.nowlifestyle.com/images/admin/pb/assets/9beaad75f15243ad34f9b383c237a12e.png" 
          alt="$500 Super Bonus – Let Others Build Your Buyers List"
          loading="eager"
        >
      </div>
      <div class="media-item">
        <video 
          controls 
          preload="metadata" 
          playsinline
          src="https://video.gvovideo.com/video/557/584NMbgeq2k7bi.mp4"
        >
          Your browser does not support the video tag.
        </video>
      </div>
    </div>

    <!-- Button zentriert darunter -->
    <a 
      href="https://listelevate.com/?id=natur1984&tr=mylead1609" 
      class="cta-button"
      target="_blank"
      rel="noopener noreferrer"
    >
      🚀 Claim Your 200% Commissions Now 🚀
    </a>

  </div>
</body>
</html>

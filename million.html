<script>
(function () {
  const COOKIE_NAME = 'ssPopupLastShown';
  const HOURS       = 1;       // 1 Stunde Sperre
  const DELAY_MS    = 3000;    // 3s nach Seitenaufruf anzeigen

  const overlay = document.getElementById('ssOverlay');
  const closeB  = document.getElementById('ssClose');
  const emailEl = document.getElementById('ssEmail');

  function getCookie(name) {
    const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]+)'));
    return m ? decodeURIComponent(m[1]) : null;
  }
  function setCookie(name, val, hours) {
    const d = new Date();
    d.setTime(d.getTime() + hours * 60 * 60 * 1000);
    document.cookie = name + '=' + encodeURIComponent(val)
                    + '; expires=' + d.toUTCString()
                    + '; path=/; SameSite=Lax';
  }
  function show() {
    overlay.classList.add('show');
    setTimeout(() => emailEl && emailEl.focus(), 200);
  }
  function hide() {
    overlay.classList.remove('show');
    setCookie(COOKIE_NAME, Date.now(), HOURS);
  }

  // Prüfen: schon gezeigt in der letzten Stunde?
  const last = parseInt(getCookie(COOKIE_NAME) || '0', 10);
  const now  = Date.now();
  if (!last || (now - last) >= HOURS * 60 * 60 * 1000) {
    setTimeout(show, DELAY_MS);
  }

  closeB.addEventListener('click', hide);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) hide(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('show')) hide();
  });
})();
</script>

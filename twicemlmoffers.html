<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Financial Freedom Starts Here</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    background: radial-gradient(circle at 50% 0%, #10233f 0%, #050b14 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 1.2vh 1.5vw;
    gap: 1vh;
  }

  /* ---------- HEADER ---------- */
  header {
    text-align: center;
    padding: 0.5vh 0;
  }

  header h1 {
    font-size: clamp(14px, 2.2vh, 30px);
    font-weight: 800;
    letter-spacing: 0.5px;
    line-height: 1.2;
    background: linear-gradient(90deg, #ffd86b, #ff9d2e, #ffd86b);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-transform: uppercase;
  }

  header p {
    font-size: clamp(10px, 1.5vh, 16px);
    color: #9fb4cc;
    margin-top: 0.4vh;
  }

  /* ---------- GRID ---------- */
  .grid {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 1.2vh 1.5vw;
  }

  .card {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 216, 107, 0.18);
    border-radius: 14px;
    padding: 1vh 1vh 1.1vh;
    gap: 0.9vh;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(255, 157, 46, 0.25);
  }

  /* identical image box for every card */
  .img-box {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-radius: 10px;
    background: #0a1420;
  }

  .img-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* ---------- BUTTON ---------- */
  .btn {
    display: block;
    text-align: center;
    text-decoration: none;
    font-size: clamp(10px, 1.55vh, 16px);
    font-weight: 800;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: #1a1200;
    padding: 1.1vh 0.6vw;
    border-radius: 999px;
    background: linear-gradient(90deg, #ffd86b, #ff9d2e);
    box-shadow: 0 4px 14px rgba(255, 157, 46, 0.45);
    transition: transform 0.2s ease, filter 0.2s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .btn:hover {
    filter: brightness(1.12);
    transform: scale(1.03);
  }

  .btn:active { transform: scale(0.98); }

  /* ---------- SMALL SCREENS ---------- */
  @media (max-width: 640px) {
    header h1 { font-size: 13px; }
    header p { font-size: 10px; }
    .btn { font-size: 9px; padding: 0.9vh 0.3vw; white-space: normal; }
  }
</style>
</head>
<body>

  <header>
    <h1>Build Your Passive Income From Home</h1>
    <p>Work From Home • Financial Freedom • No Experience Needed</p>
  </header>

  <main class="grid">

    <!-- CARD 1 -->

        <img src="https://mygreatlifepay.com/wp-content/uploads/elementor/thumbs/14_95_Image_2_jfif-rutwrdwlvp4hd0a9edobca2bb3oomet7g2afy1voh4.avif" alt="Passive income opportunity">
      </div>
      <a class="btn" href="https://mygreatlifepay.com/ref/natur/1/" target="_blank" rel="noopener">Start Your Passive Income Now</a>
    </div>

    <!-- CARD 2 -->
    <div class="card">
      <div class="img-box">
        <img src="https://images.nowlifestyle.com/images/admin/pb/assets/773055476006c09d133a689417c603ae.jpg" alt="Work from home opportunity">
      </div>
      <a class="btn" href="https://secureyourdata.gotbackuptour.com/?tr=twicetraffic" target="_blank" rel="noopener">Secure Your Financial Future</a>
    </div>

    <!-- CARD 3 -->
    <div class="card">
      <div class="img-box">
        <img src="https://sendshark.com/7minbanners/banner_108.png" alt="Earn from home offer">
      </div>
      <a class="btn" href="https://sendshark.com/?id=natur1984&tr=twiceconfirmed" target="_blank" rel="noopener">Unlock Your Work-From-Home Income</a>
    </div>

    <!-- CARD 4 -->
    <div class="card">
      <div class="img-box">
        <img src="https://images.nowlifestyle.com/images/admin/pb/assets/9beaad75f15243ad34f9b383c237a12e.png" alt="Financial freedom offer">
      </div>
      <a class="btn" href="https://listelevate.com/?id=natur1984&tr=twicetraffic" target="_blank" rel="noopener">Claim Your Freedom Lifestyle</a>
    </div>

  </main>

</body>
</html>

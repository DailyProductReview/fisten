<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zilara Tour</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }

    /* Video / Thumbnail Container 16:9 */
    .video-wrap {
      position: relative;
      width: 100%;
      max-width: 960px;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: 14px;
      overflow: hidden;
      background: #111;
      box-shadow: 0 0 60px rgba(255, 255, 255, 0.08);
    }

    .video-wrap iframe,
    .video-wrap a {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .video-wrap iframe { border: 0; display: block; }

    /* Thumbnail-Fallback */
    .thumb {
      display: block;
      background-size: cover;
      background-position: center;
      text-decoration: none;
    }

    .thumb::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      transition: background 0.2s ease;
    }

    .thumb:hover::after { background: rgba(0, 0, 0, 0.15); }

    /* Play-Button */
    .play {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 84px;
      height: 84px;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.92);
      border-radius: 50%;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .play::before {
      content: "";
      margin-left: 6px;
      border-style: solid;
      border-width: 16px 0 16px 26px;
      border-color: transparent transparent transparent #000;
    }

    .thumb:hover .play {
      transform: translate(-50%, -50%) scale(1.08);
      background: #fff;
    }

    /* CTA Button */
    .cta {
      display: inline-block;
      margin-top: 40px;
      padding: 18px 52px;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      color: #000;
      background: #fff;
      border-radius: 999px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .cta:hover, .cta:focus-visible {
      transform: translateY(-2px);
      background: #f0f0f0;
      box-shadow: 0 10px 30px rgba(255, 255, 255, 0.25);
      outline: none;
    }
    .cta:active { transform: translateY(0); }

    @media (max-width: 480px) {
      .cta { width: 100%; max-width: 340px; padding: 16px 24px; font-size: 0.95rem; }
      .play { width: 64px; height: 64px; }
      .play::before { border-width: 12px 0 12px 20px; }
    }
  </style>
</head>
<body>

  <div class="video-wrap">
    <a class="thumb"
       href="https://www.youtube.com/watch?v=R0iw4EvAu8Q"
       target="_blank" rel="noopener"
       style="background-image:url('https://img.youtube.com/vi/R0iw4EvAu8Q/maxresdefault.jpg');">
      <span class="play"></span>
    </a>
  </div>

  <a class="cta" href="https://zilaratour.com/index.asp?site=2516503" target="_blank" rel="noopener">
    Discover Now
  </a>

</body>
</html>
